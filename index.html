<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nigga's PokeCup</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f8;--fg:#0d1b2a;--card:#fff;--mut:#5a6b80;--bd:#d5deea;--ac:#1f5fd1;--bt:#fff;--hl:#ffc824;--ok:#17874a}
@media(prefers-color-scheme:dark){:root{--bg:#0a1422;--fg:#e8f1fb;--card:#112036;--mut:#8da2bd;--bd:#223853;--ac:#5aa0ff;--bt:#06101d;--ok:#3fd184}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 "Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;gap:6px 20px;align-items:center;flex-wrap:wrap;padding:14px 22px;background:var(--card);border-bottom:4px solid var(--hl)}
header a{color:var(--fg);text-decoration:none;padding:3px 0;border-bottom:2px solid transparent}
header a.on{border-color:var(--ac);font-weight:700}
header a.logo{font-size:24px;font-weight:800;letter-spacing:-.8px;display:flex;align-items:center;gap:8px;border:0}
.logo i{width:20px;height:20px;border-radius:50%;background:linear-gradient(#e23d4b 44%,var(--fg) 44% 56%,#fff 56%);border:2px solid var(--fg)}
.sp{flex:1}
main{max-width:860px;margin:0 auto;padding:22px}
a{color:var(--ac)}
h2{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:0 0 12px}
h3{font-size:17px;margin:0 0 10px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:0 0 14px}
.c.live{border-left:5px solid var(--ac)}
.c.camp{background:linear-gradient(100deg,color-mix(in srgb,var(--hl) 45%,var(--card)),var(--card));border-color:var(--hl);font-size:17px}
input,select,button{font:inherit;padding:8px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg)}
button{background:var(--ac);color:var(--bt);border:0;border-radius:99px;cursor:pointer;font-weight:700;padding:8px 16px}
button.g{background:var(--bd);color:var(--fg)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 6px;text-align:left;border-bottom:1px solid var(--bd)}
th{color:var(--mut);font-weight:600;font-size:13px}
tr.first td{background:color-mix(in srgb,var(--hl) 30%,transparent);font-weight:800}
.m{color:var(--mut);font-size:13px}
.t{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--bd)}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.w{color:var(--ok);font-weight:800}
.cn{display:inline-flex;align-items:center;gap:5px;font-weight:800;padding:3px 12px 3px 6px;border-radius:99px;background:color-mix(in srgb,var(--hl) 28%,transparent)}
</style>
</head>
<body>
<header id="hd"></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// 1) Cole aqui a URL e a chave "anon" do seu projeto Supabase (Project Settings > API)
const SB_URL = 'https://nxtuppzmptbobmjiynor.supabase.co', SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54dHVwcHptcHRib2Jtaml5bm9yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUyMDg5ODUsImV4cCI6MjExMDc4NDk4NX0.WnSBHti09i5I7QF3QV9eQACCtqWIwy-gT71JIOGl9hQ';
const NOME_SITE = 'Niggas PokeCup', MOEDA = 'N-Coins';   // nome do site e da moeda fictícia
const START_BALANCE = 1000, MARGIN = 0.95;
// Ícone da moeda: um P cortado por uma barra vertical, como o símbolo de um cifrão
const coin = (z = 18) => `<svg width="${z}" height="${z}" viewBox="0 0 24 24" aria-hidden="true" style="vertical-align:middle"><circle cx="12" cy="12" r="11" fill="#ffc824" stroke="#b9860a" stroke-width="1.5"/><text x="12" y="17.5" text-anchor="middle" font-size="15" font-weight="800" fill="#5a3b00" font-family="Arial,sans-serif">N</text><line x1="12" y1="3.5" x2="12" y2="20.5" stroke="#5a3b00" stroke-width="1.8" stroke-linecap="round"/></svg>`;

// Deixa só o endereço base (https://xxxx.supabase.co), mesmo que tenham colado a URL com algo a mais
function limpaUrl(u){
  u = u.trim();
  try {
    const x = new URL(u), m = x.pathname.match(/\/project\/([a-z0-9]+)/);
    if(/supabase\.com$/.test(x.hostname) && m) return 'https://' + m[1] + '.supabase.co';
    return x.origin;
  } catch(e){ return u; }
}
let sb = null, initErr = '', perfilErr = '', carregado = false;
try {
  if(SB_URL.startsWith('COLE') || SB_KEY.startsWith('COLE')) throw new Error('as chaves ainda não foram preenchidas');
  sb = supabase.createClient(limpaUrl(SB_URL), SB_KEY.trim());
} catch(e){ initErr = String(e.message || e); }
const $ = s => document.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
addEventListener('error', ev => { $('#app').innerHTML = '<div class=c><b>Ocorreu um erro:</b> ' + h(ev.message) + '</div>'; });
const ST = {open:'Inscrições abertas', running:'Em andamento', finished:'Encerrado'};
let me = null, D = {players:[],events:[],entries:[],matches:[],bets:[]};

const nm = id => D.players.find(p => p.id === id)?.name || '?';
const avail = id => START_BALANCE + D.bets.filter(b => b.player_id === id).reduce((s,b) => s - b.amount + (b.payout || 0), 0);

// Odds: taxa de vitórias suavizada (histórico de todos os eventos) -> probabilidade -> odd com margem da casa
function rate(id){
  const g = D.matches.filter(m => m.winner && (m.p1 === id || m.p2 === id));
  return (g.filter(m => m.winner === id).length + 1) / (g.length + 2);
}
function oddsFor(a, b){
  const ra = rate(a), rb = rate(b), pa = ra / (ra + rb);
  const f = p => Math.max(1.05, +(MARGIN / p).toFixed(2));
  return [f(pa), f(1 - pa)];
}

async function load(){
  const tabs = ['players','events','entries','matches','bets'];
  const res = await Promise.all(tabs.map(t => sb.from(t).select('*')));
  tabs.forEach((t,i) => D[t] = res[i].data || []);
}

// Chaveamento (método do círculo). k = número de rodadas, ou null para todos contra todos.
function sched(ids, k){
  const a = ids.slice().sort(() => Math.random() - .5);
  if(a.length % 2) a.push(null);
  const n = a.length, per = n - 1, R = k || per, out = [];
  for(let r = 0; r < R; r++){
    const s = r % per, rest = a.slice(1);
    const arr = [a[0], ...rest.slice(per - s).concat(rest.slice(0, per - s))];
    for(let i = 0; i < n / 2; i++){
      const x = arr[i], y = arr[n - 1 - i];
      if(x && y) out.push([r + 1, x, y]);
    }
  }
  return out;
}

// Depois de cada resultado: se tudo acabou, define campeão ou cria desempate
const lideres = (ids, f) => { const m = Math.max(...ids.map(f)); return ids.filter(i => f(i) === m); };
const pairs = c => c.flatMap((a,i) => c.slice(i + 1).map(b => [a,b]));
async function advance(ev){
  await load();
  const ms = D.matches.filter(m => m.event_id === ev.id);
  if(ms.some(m => !m.winner)) return;
  const ids = D.entries.filter(e => e.event_id === ev.id).map(e => e.player_id);
  const w = (L, id) => L.filter(m => m.winner === id).length;
  let c = lideres(ids, id => w(ms.filter(m => !m.is_tiebreak), id));
  const rs = [...new Set(ms.filter(m => m.is_tiebreak).map(m => m.round))].sort((a,b) => a - b);
  for(const r of rs){ const L = ms.filter(m => m.is_tiebreak && m.round === r); c = lideres(c, id => w(L, id)); }
  if(c.length === 1){
    await sb.from('events').update({status:'finished', champion:c[0]}).eq('id', ev.id);
  } else {
    const r = Math.max(...ms.map(m => m.round)) + 1;
    await sb.from('matches').insert(pairs(c).map(([a,b]) => ({event_id:ev.id, round:r, p1:a, p2:b, is_tiebreak:true})));
  }
}

// ---------- ações ----------
async function signup(){
  const {data, error} = await sb.auth.signUp({email:$('#em').value, password:$('#pw').value, options:{data:{name:$('#nm').value.trim()}}});
  if(error) return alert(error.message);
  if(!data.session) alert('Confirme o e-mail para entrar (ou desative a confirmação no Supabase).');
}
async function login(){
  const {error} = await sb.auth.signInWithPassword({email:$('#em').value, password:$('#pw').value});
  if(error) alert(error.message);
}
const logout = () => sb.auth.signOut();
async function refresh(){ await load(); render(); }
async function createEv(){
  const name = $('#en').value.trim(), mode = $('#emo').value, rounds = +$('#er').value;
  if(!name) return alert('Dê um nome ao campeonato.');
  if(mode === 'rounds' && !(rounds > 0)) return alert('Informe o número de rodadas.');
  const {data, error} = await sb.from('events').insert({name, creator:me.id, mode, rounds:mode === 'rounds' ? rounds : null}).select().single();
  if(error) return alert(error.message);
  await load(); location.hash = '#/e/' + data.id;
}
async function join(id){ const {error} = await sb.from('entries').insert({event_id:id, player_id:me.id}); if(error) alert(error.message); refresh(); }
async function leave(id){ await sb.from('entries').delete().eq('event_id', id).eq('player_id', me.id); refresh(); }
async function start(id){
  const ev = D.events.find(e => e.id === id), ids = D.entries.filter(e => e.event_id === id).map(e => e.player_id);
  if(ids.length < 2) return alert('São necessários pelo menos 2 inscritos.');
  const k = ev.mode === 'rounds' ? ev.rounds : null;
  if(k && ids.length % 2 && k % ids.length) return alert(`Com ${ids.length} inscritos (número ímpar), o número de rodadas precisa ser múltiplo de ${ids.length} para todos jogarem a mesma quantidade de partidas.`);
  if(!confirm('Encerrar inscrições e gerar o chaveamento?')) return;
  const rows = sched(ids, k).map(([round,p1,p2]) => ({event_id:id, round, p1, p2}));
  const r1 = await sb.from('matches').insert(rows); if(r1.error) return alert(r1.error.message);
  await sb.from('events').update({status:'running'}).eq('id', id);
  refresh();
}
async function res(mid, w){
  if(!confirm('Registrar vitória de ' + nm(w) + '?')) return;
  const m = D.matches.find(x => x.id === mid), ev = D.events.find(e => e.id === m.event_id);
  const {error} = await sb.from('matches').update({winner:w}).eq('id', mid); if(error) return alert(error.message);
  await Promise.all(D.bets.filter(b => b.match_id === mid).map(b =>
    sb.from('bets').update({payout: b.pick === w ? Math.round(b.amount * b.odds) : 0}).eq('id', b.id)));
  await advance(ev); refresh();
}
async function bet(mid){
  const m = D.matches.find(x => x.id === mid), pick = $('#p_' + mid).value, amt = Math.floor(+$('#a_' + mid).value);
  if(!(amt > 0) || amt > avail(me.id)) return alert('Valor inválido ou saldo insuficiente.');
  const [o1, o2] = oddsFor(m.p1, m.p2);
  const {error} = await sb.from('bets').insert({match_id:mid, player_id:me.id, pick, amount:amt, odds: pick === m.p1 ? o1 : o2});
  if(error) return alert(error.message);
  refresh();
}

// ---------- telas ----------
const authCard = () => `<div class=c><h3>Entrar</h3><div class=r>
  <input id=nm placeholder="Seu nome (só no cadastro)"><input id=em type=email placeholder="E-mail"><input id=pw type=password placeholder="Senha (mín. 6)">
  <button onclick="login()">Entrar</button><button class=g onclick="signup()">Criar conta</button></div></div>`;

function homeView(){
  const form = me ? `<div class=c><h3>Novo campeonato</h3><div class=r>
    <input id=en placeholder="Nome do campeonato">
    <select id=emo onchange="$('#er').hidden=this.value!=='rounds'"><option value=roundrobin>Todos contra todos</option><option value=rounds>Número de rodadas</option></select>
    <input id=er type=number min=1 placeholder="Rodadas" hidden style="width:100px"><button onclick="createEv()">Criar campeonato</button></div></div>` : '';
  const list = D.events.slice().sort((a,b) => b.created_at.localeCompare(a.created_at)).map(e => `<div class=c>
    <a href="#/e/${e.id}"><b>${h(e.name)}</b></a> <span class=t>${ST[e.status]}</span>
    <div class=m>Criado por ${h(nm(e.creator))}, ${e.mode === 'rounds' ? e.rounds + ' rodadas' : 'todos contra todos'}, ${D.entries.filter(x => x.event_id === e.id).length} inscritos${e.champion ? ', campeão: ' + h(nm(e.champion)) : ''}</div></div>`).join('');
  return form + '<h2>Campeonatos</h2>' + (list || '<p class=m>Nenhum campeonato ainda. Crie o primeiro acima.</p>');
}

function winsView(){
  const c = {};
  D.events.filter(e => e.champion).forEach(e => c[e.champion] = (c[e.champion] || 0) + 1);
  const rows = Object.entries(c).sort((a,b) => b[1] - a[1]);
  return `<h2>Tabela de vencedores</h2><div class=c><table><tr><th>#</th><th>Jogador</th><th>Pokecups</th></tr>${
    rows.map(([i,n],k) => `<tr><td>${k + 1}</td><td>${h(nm(i))}</td><td>${n}</td></tr>`).join('') || '<tr><td colspan=3 class=m>Ninguém venceu uma Pokecup ainda.</td></tr>'}</table></div>`;
}

function coinsView(){
  const rows = D.players.map(p => {
    const done = D.bets.filter(b => b.player_id === p.id && b.payout != null);
    const lucro = done.reduce((s,b) => s + b.payout - b.amount, 0);
    return {p:p.id, saldo:START_BALANCE + lucro, lucro, certas:done.filter(b => b.payout > 0).length, n:done.length};
  }).sort((a,b) => b.saldo - a.saldo || nm(a.p).localeCompare(nm(b.p)));
  return `<h2>Ranking de ${MOEDA}</h2><div class=c><table><tr><th>#</th><th>Jogador</th><th>Saldo</th><th>Lucro</th><th>Acertos</th></tr>${
    rows.map((x,i) => `<tr class="${i === 0 && x.n ? 'first' : ''}"><td>${i + 1}</td><td>${h(nm(x.p))}</td><td>${coin(16)} ${x.saldo}</td><td>${x.lucro > 0 ? '+' : ''}${x.lucro}</td><td>${x.certas}/${x.n}</td></tr>`).join('')}</table></div>
    <p class=m>Saldo = ${START_BALANCE} iniciais + lucro das apostas já resolvidas. Apostas em andamento ainda não entram.</p>`;
}

function evView(id){
  const ev = D.events.find(e => e.id === id);
  if(!ev) return '<p>Campeonato não encontrado. <a href="#/">Voltar</a></p>';
  const isC = me && me.id === ev.creator, en = D.entries.filter(e => e.event_id === id).map(e => e.player_id), joined = me && en.includes(me.id);
  let s = `<p><a href="#/">Voltar aos campeonatos</a></p><h2>${h(ev.name)} <span class=t>${ST[ev.status]}</span></h2>
    <p class=m>Criado por ${h(nm(ev.creator))}, ${ev.mode === 'rounds' ? ev.rounds + ' rodadas' : 'todos contra todos'}</p>`;
  if(ev.champion) s += `<div class="c camp">🏆 Campeão: <b>${h(nm(ev.champion))}</b></div>`;
  if(ev.status === 'open'){
    return s + `<div class=c><h3>Inscritos (${en.length})</h3>${en.map(i => h(nm(i))).join(', ') || 'Ninguém ainda.'}<div class=r>
      ${me && !joined ? `<button onclick="join('${id}')">Inscrever-me</button>` : ''}
      ${joined ? `<button class=g onclick="leave('${id}')">Cancelar inscrição</button>` : ''}
      ${isC ? `<button onclick="start('${id}')">Encerrar inscrições e gerar chaveamento</button>` : ''}</div></div>`;
  }
  const ms = D.matches.filter(m => m.event_id === id).sort((a,b) => a.round - b.round);
  const reg = ms.filter(m => !m.is_tiebreak);
  const tab = en.map(p => ({p, pts:reg.filter(m => m.winner === p).length, j:reg.filter(m => m.winner && (m.p1 === p || m.p2 === p)).length}))
    .sort((a,b) => b.pts - a.pts || nm(a.p).localeCompare(nm(b.p)));
  s += `<div class=c><h3>Classificação</h3><table><tr><th>#</th><th>Jogador</th><th>Pontos</th><th>Jogos</th></tr>${
    tab.map((x,i) => `<tr class="${i === 0 && x.pts ? 'first' : ''}"><td>${i + 1}</td><td>${h(nm(x.p))}</td><td>${x.pts}</td><td>${x.j}</td></tr>`).join('')}</table></div>`;
  const pend = ms.filter(m => !m.winner), cur = pend.length ? Math.min(...pend.map(m => m.round)) : 0;
  if(pend.some(m => m.is_tiebreak)) s += `<div class=c><b>Empate no topo.</b> Há uma partida de desempate pelo 1º lugar.</div>`;
  const rounds = [...new Set(ms.map(m => m.round))];
  s += rounds.map(r => `<h3>Rodada ${r}</h3>` + ms.filter(m => m.round === r).map(m => {
    const open = !m.winner && m.round === cur, [o1,o2] = oddsFor(m.p1, m.p2);
    const bs = D.bets.filter(b => b.match_id === m.id);
    return `<div class="c${open ? ' live' : ''}"><div class=r>
      <span class="${m.winner === m.p1 ? 'w' : ''}">${h(nm(m.p1))}</span> contra <span class="${m.winner === m.p2 ? 'w' : ''}">${h(nm(m.p2))}</span>
      ${m.is_tiebreak ? '<span class=t>Desempate</span>' : ''}${m.winner ? `<span class=m>Vencedor: ${h(nm(m.winner))}</span>` : ''}</div>
      ${open ? `<div class=m>Odds: ${h(nm(m.p1))} ${o1.toFixed(2)} / ${h(nm(m.p2))} ${o2.toFixed(2)}</div>` : ''}
      ${isC && !m.winner ? `<div class=r><button onclick="res('${m.id}','${m.p1}')">${h(nm(m.p1))} venceu</button><button onclick="res('${m.id}','${m.p2}')">${h(nm(m.p2))} venceu</button></div>` : ''}
      ${open && joined && me.id !== m.p1 && me.id !== m.p2 ? `<div class=r><select id="p_${m.id}"><option value="${m.p1}">${h(nm(m.p1))}</option><option value="${m.p2}">${h(nm(m.p2))}</option></select>
        <input id="a_${m.id}" type=number min=1 max=${avail(me.id)} placeholder="Valor" style="width:100px"><button onclick="bet('${m.id}')">Apostar</button></div>` : ''}
      ${bs.map(b => `<div class=m>${h(nm(b.player_id))} apostou ${b.amount} em ${h(nm(b.pick))} (odd ${(+b.odds).toFixed(2)})${b.payout != null ? (b.payout ? ', ganhou ' + b.payout : ', perdeu') : ''}</div>`).join('')}
    </div>`;
  }).join('')).join('');
  return s;
}

function render(){
  const r = location.hash || '#/', a = $('#app');
  document.title = NOME_SITE;
  const nav = [['#/','Campeonatos'],['#/wins','Vencedores'],['#/coins','Moedas']].map(([l,t]) =>
    `<a href="${l}" class="${r === l || (l === '#/' && r.startsWith('#/e/')) ? 'on' : ''}">${t}</a>`).join('');
  $('#hd').innerHTML = `<a class=logo href="#/"><i></i>${h(NOME_SITE)}</a>${nav}<span class=sp></span>` +
    (me ? (D.players.some(p => p.id === me.id) ? `<span>${h(nm(me.id))}</span><span class=cn title="Saldo disponível">${coin(18)} ${avail(me.id)}</span>` :
      carregado ? `<span class=m>Seu perfil de jogador não foi criado${perfilErr ? ': ' + h(perfilErr) : ''}</span>` : '') +
     `<button class=g onclick="logout()">Sair</button>` : '');
  if(!sb) return a.innerHTML = `<div class=c><h3>Falta configurar o banco de dados</h3>
    <p>O site já está no ar, mas ainda não está conectado ao Supabase. No arquivo <b>index.html</b>, perto do começo do código, troque:</p>
    <p><code>COLE_AQUI_A_URL</code> pela <b>Project URL</b> do seu projeto Supabase<br><code>COLE_AQUI_A_CHAVE_ANON</code> pela chave <b>anon</b> (começa com eyJ)</p>
    <p class=m>Passo a passo completo no README.${initErr ? ' Detalhe técnico: ' + h(initErr) : ''}</p></div>`;
  a.innerHTML = (me ? '' : authCard()) + (r.startsWith('#/e/') ? evView(r.slice(4)) : r === '#/wins' ? winsView() : r === '#/coins' ? coinsView() : homeView());
}

window.onhashchange = render;
if(sb){
  render();  // já mostra a tela de login, mesmo antes dos dados chegarem
  sb.auth.onAuthStateChange((_, s) => {
    me = s?.user || null;
    render();
    // adiado de propósito: consultar o banco dentro deste aviso travaria o Supabase
    setTimeout(async () => {
      try {
        if(me){
          let nome = (me.user_metadata.name || me.email.split('@')[0]).trim().slice(0, 24);
          if(nome.length < 2) nome += '_';
          const r = await sb.from('players').upsert({id:me.id, name:nome}, {ignoreDuplicates:true});
          perfilErr = r.error ? r.error.message : '';
        }
        await load(); carregado = true;
      } catch(e){ console.error(e); }
      render();
    }, 0);
  });
  setInterval(() => { if(document.activeElement.tagName !== 'INPUT') refresh(); }, 15000);
} else render();
</script>
</body>
</html>
